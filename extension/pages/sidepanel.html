<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel POA</title>
  
  <link rel="stylesheet" href="../libs/driver.js.css">
  <link rel="stylesheet" href="../styles/sidepanel.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <div class="logo-area" id="header-logo">
      <img src="../images/logo-48.png" alt="Logo POA" class="logo-img">
      
      <div class="logo-text">
        <h1>POA</h1>
        <span>Professor Online Automático</span>
      </div>
    </div>

    <button id="btn-ajuda" class="header-icon-btn" title="Ajuda / Tutorial" aria-label="Ver Tutorial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
  </header>

  <main>
    <section>
      <h2>Acesso Rápido</h2>
      <div class="grid-menu">
        <a href="https://professor.seduc.ce.gov.br/" target="_blank" class="card-link">
          <div class="icon-box green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <span>Professor Online</span>
        </a>
        <a href="https://diretordeturma.seduc.ce.gov.br/" target="_blank" class="card-link">
          <div class="icon-box orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <span>SIGE PPDT</span>
        </a>
        <a href="https://sisedu.seduc.ce.gov.br/" target="_blank" class="card-link">
          <div class="icon-box blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
              <path d="M9 14l2 2 4-4"></path>
            </svg>
          </div>
          <span>Plataforma SISEDU</span>
        </a>
        <a id="acesso-rapido-drive-poa" href="https://drive.google.com/drive/folders/17m1nizx7w5mXe8MXnQQp_YRXJMXoteT8?usp=sharing" target="_blank" class="card-link">
          <div class="icon-box purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 13 13"></polyline>
              <polyline points="17 21 17 13 23 13"></polyline>
            </svg>
          </div>
          <span>Planilhas POA</span>
        </a>
      </div>
    </section>

    <hr class="divider">

    <section>
      <h2>Ferramentas de Página</h2>

      <div id="transferencia-container" class="input-group">
        <label for="data-area">Área de Transferência (Ctrl+V / Ctrl+C)</label>
        <textarea id="data-area" rows="4" placeholder="Cole aqui as informações que serão lançadas (notas, faltas, etc)."></textarea>

        <div class="clipboard-actions">
          <button id="btn-colar" class="clip-btn" title="Colar da área de transferência">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            Colar
          </button>

          <button id="btn-copiar" class="clip-btn" title="Copiar conteúdo">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copiar
          </button>

          <button id="btn-limpar" class="clip-btn" title="Limpar tudo">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            Limpar
          </button>
        </div>
      </div>

      <div class="actions-grid" id="acoes-container">
        <button id="btn-lancar-notas" class="action-btn" aria-label="Lançar Notas">
          <span class="status-led" id="led-notas"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Lançar Notas
        </button>

        <button id="btn-lancar-frequencia" class="action-btn" aria-label="Lançar Frequência">
          <span class="status-led" id="led-frequencia"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <polyline points="16 11 18 13 22 9"></polyline>
          </svg>
          Lançar Faltas
        </button>

        <button id="btn-verificar-pendencias" class="action-btn secondary" aria-label="Verificar Pendências">
          <span class="status-led" id="led-pendencias"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Verificar Pendências
        </button>
        
        <button id="btn-lancar-aulas" class="action-btn" aria-label="Lançar Aulas em Lote">
          <span class="status-led" id="led-aulas"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Lançar Registro de Aulas
        </button>

        <button id="btn-lancar-gabaritos-sisedu" class="action-btn" aria-label="Lançar Gabaritos SISEDU">
          <span class="status-led" id="led-sisedu"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Lançar Gabaritos SISEDU
        </button>
      </div>
    </section>
  </main>

  <footer id="rodape-container">
    <div class="footer-info">
      <p>POA v1.2 &copy; 2025 - Anderson Freitas</p>
      <p>Este projeto não possui vínculo oficial com a SEDUC/CE.</p>
    </div>

    <div id="social-container" class="social-mini">
      <a href="https://instagram.com/andersonfreitas.art" target="_blank" class="mini-btn instagram" title="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <a href="https://chromewebstore.google.com/detail/poa-professor-online-auto/oldpblcflndidacfilioieboofkpldaa/reviews" target="_blank" class="mini-btn star" title="Avaliar / Sugestões">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </a>
    </div>
  </footer>

  <div id="toast-container"></div>
  
  <script src="../libs/driver.js.js"></script>
  <script src="../scripts/sidepanel.js"></script>
</body>
</html>
