<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor - Gabarito Fácil</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video { display: none; }
        canvas { width: 100%; height: 100%; object-fit: contain; }

        .hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .status-pill {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            max-width: 90%;
        }

        button {
            pointer-events: auto;
            background-color: #9c27b0;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:disabled { background-color: #555; opacity: 0.7; }

        .debug-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <div class="debug-toggle" onclick="toggleDebug()">👁️ Ver Contornos</div>

    <div class="camera-container">
        <video id="videoInput" playsinline autoplay></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div class="hud">
        <div id="statusMsg" class="status-pill">Carregando Sistema...</div>
        <button id="btnStart" onclick="startCamera()" disabled>Aguarde...</button>
    </div>

    <script async src="https://docs.opencv.org/4.5.5/opencv.js" onload="onOpenCvReady()" type="text/javascript"></script>

    <script>
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        
        let stream = null;
        let streaming = false;
        let cvReady = false;
        let debugMode = false;

        let src = null;
        let dst = null;
        let gray = null;
        let contours = null;
        let hierarchy = null;

        function onOpenCvReady() {
            console.log('OpenCV Ready');
            cvReady = true;
            document.getElementById('statusMsg').innerText = "Sistema Pronto. Inicie a Câmera.";
            const btn = document.getElementById('btnStart');
            btn.disabled = false;
            btn.innerText = "📷 Iniciar Câmera";
            btn.style.backgroundColor = "#00e676";
            btn.style.color = "#004d2f";
        }

        async function startCamera() {
            if (streaming) return;

            // CONFIGURAÇÃO UNIVERSAL (PC + MOBILE)
            // Removemos 'facingMode' estrito para funcionar na Webcam do PC
            const constraints = {
                video: {
                    width: { ideal: 1280 }, // Tenta HD, mas aceita menos
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                document.getElementById('statusMsg').innerText = "Solicitando permissão da câmera...";
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Aguarda o vídeo carregar os metadados
                video.onloadedmetadata = () => {
                    video.play();
                    
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    document.getElementById('btnStart').style.display = 'none';
                    document.getElementById('statusMsg').innerText = "Câmera Ativa. Aponte para o Gabarito.";
                    
                    if (cvReady) {
                        // Inicializa Matrizes
                        src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
                        dst = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC1);
                        gray = new cv.Mat();
                        contours = new cv.MatVector();
                        hierarchy = new cv.Mat();
                        
                        streaming = true;
                        requestAnimationFrame(processVideo);
                    }
                };

            } catch (err) {
                console.error("Erro Câmera:", err);
                let erroMsg = "Erro desconhecido.";
                
                if (err.name === 'NotAllowedError') erroMsg = "Permissão de câmera negada.";
                else if (err.name === 'NotFoundError') erroMsg = "Nenhuma câmera encontrada.";
                else if (window.location.protocol === 'file:') erroMsg = "ERRO: O navegador bloqueia câmera em arquivos locais. Use um servidor local (Live Server).";

                document.getElementById('statusMsg').innerText = "❌ " + erroMsg;
                document.getElementById('statusMsg').style.backgroundColor = "#d32f2f";
            }
        }

        function toggleDebug() {
            debugMode = !debugMode;
        }

        function processVideo() {
            if (!streaming) return;

            try {
                let cap = new cv.VideoCapture(video);
                cap.read(src);

                // 1. Converter para Cinza
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

                // 2. Threshold (Binarização)
                // Usa valores fixos ou adaptativos para achar preto vs branco
                cv.adaptiveThreshold(gray, dst, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 21, 5);

                // 3. Achar Contornos
                cv.findContours(dst, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                // Desenha a imagem base (Colorida ou Binarizada dependendo do modo)
                if (!debugMode) {
                    cv.imshow('canvasOutput', src); 
                } else {
                    // Modo robô: mostra o que o algoritmo vê
                    cv.imshow('canvasOutput', dst);
                }

                // 4. Filtrar e Desenhar Retângulos
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    
                    // Filtro de Área: Ignora ruídos pequenos e coisas gigantes
                    if (area > 300 && area < 50000) {
                        let peri = cv.arcLength(cnt, true);
                        let approx = new cv.Mat();
                        cv.approxPolyDP(cnt, approx, 0.04 * peri, true);

                        // Se tem 4 vértices (é um quadrado/retângulo) e é convexo
                        if (approx.rows === 4 && cv.isContourConvex(approx)) {
                            
                            // Desenha contorno vermelho
                            let color = new cv.Scalar(255, 0, 0, 255);
                            let vec = new cv.MatVector();
                            vec.push_back(approx);
                            
                            // Se estivermos no modo normal, desenha por cima da imagem colorida
                            // Precisamos ler o canvas de volta para src se quisermos acumular desenhos (simplificado aqui)
                            // O imshow desenha IMEDIATAMENTE.
                            // Nota: A estrutura de loop do OpenCV.js com imshow pode piscar se não gerida bem.
                            // Mas para debug visual rápido, isso serve.
                        }
                        approx.delete();
                    }
                }
                
                // RE-DESENHAR CONTORNOS (Método mais limpo para JS)
                // Percorremos de novo para desenhar tudo de uma vez
                if (!debugMode) {
                    for (let i = 0; i < contours.size(); ++i) {
                         let cnt = contours.get(i);
                         let area = cv.contourArea(cnt);
                         if (area > 300 && area < 50000) {
                            let peri = cv.arcLength(cnt, true);
                            let approx = new cv.Mat();
                            cv.approxPolyDP(cnt, approx, 0.04 * peri, true);
                            if (approx.rows === 4 && cv.isContourConvex(approx)) {
                                let color = new cv.Scalar(255, 0, 0, 255);
                                cv.drawContours(src, contours, i, color, 3, cv.LINE_8, hierarchy, 0);
                            }
                            approx.delete();
                         }
                    }
                    cv.imshow('canvasOutput', src);
                }

                requestAnimationFrame(processVideo);
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
