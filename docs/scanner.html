<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaba Fácil - Leitor Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #2e7d32; --accent: #00e676; --bg: #121212; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            flex-grow: 1;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvasOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        .ui-layer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px 20px 40px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            text-align: center;
            z-index: 20;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        input[type="number"] {
            width: 50px; padding: 8px; border-radius: 5px; border: none; 
            text-align: center; font-size: 1.1rem; font-weight: bold;
        }

        .btn-scan {
            background-color: white; color: var(--primary); 
            border: none; padding: 18px 40px;
            font-size: 1.2rem; font-weight: bold; border-radius: 50px; 
            cursor: pointer; box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
            transition: all 0.2s;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-scan:active { transform: scale(0.95); }
        .btn-scan.ready { background-color: var(--accent); color: #000; }

        #status-pill {
            background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 15px;
            font-size: 0.9rem; border: 1px solid #555;
        }

        /* Modal de Resultados */
        #result-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #121212; z-index: 100;
            display: none; flex-direction: column;
            padding: 20px; overflow-y: auto;
        }
        
        .result-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px;
            margin-top: 20px;
        }
        .ans-item {
            background: #222; padding: 10px 5px; border-radius: 6px; text-align: center; border: 1px solid #333;
        }
        .ans-q { font-size: 0.7rem; color: #888; margin-bottom: 2px; }
        .ans-val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        
        /* Debug Canvas Oculto */
        #hiddenCanvas { display: none; }
    </style>
    
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
</head>
<body>

    <div class="camera-container">
        <video id="videoInput" playsinline muted autoplay></video>
        <canvas id="canvasOverlay"></canvas>
    </div>

    <div class="ui-layer">
        <div id="status-pill">Carregando IA...</div>
        
        <div class="controls-row">
            <label>Nº Questões:</label>
            <input type="number" id="qtd-questoes" value="20" min="1" max="60">
        </div>

        <button id="btn-action" class="btn-scan" onclick="handleButtonClick()">
            📷 Iniciar Câmera
        </button>
    </div>

    <div id="result-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; color:var(--accent);">Gabarito Lido</h2>
            <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:2rem;">×</button>
        </div>
        <div id="answers-list" class="result-grid"></div>
        <button class="btn-scan" style="margin-top:20px; width:100%; justify-content:center;" onclick="closeModal()">Ler Próximo</button>
        <canvas id="debug-cut" style="width:100%; margin-top:20px; border:1px solid #333; border-radius:8px;"></canvas>
    </div>

    <canvas id="hiddenCanvas"></canvas>

    <script>
        let video = document.getElementById('videoInput');
        let canvasOverlay = document.getElementById('canvasOverlay');
        let ctxOverlay = canvasOverlay.getContext('2d');
        let stream = null;
        let isStreaming = false;
        let cvReady = false;
        let bestContourPoints = null;

        function onOpenCvReady() {
            cvReady = true;
            document.getElementById('status-pill').innerText = "Sistema Pronto";
        }

        async function handleButtonClick() {
            if (!isStreaming) {
                await startCamera();
            } else {
                captureAndProcess();
            }
        }

        async function startCamera() {
            if (!cvReady) return;
            try {
                const constraints = { 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    isStreaming = true;
                    canvasOverlay.width = video.videoWidth;
                    canvasOverlay.height = video.videoHeight;
                    
                    const btn = document.getElementById('btn-action');
                    btn.innerText = "🔍 Escanear";
                    
                    document.getElementById('status-pill').innerText = "Aponte para a folha (fundo escuro)";
                    requestAnimationFrame(processVideoLoop);
                };
            } catch (err) { alert("Erro Câmera: " + err.name); }
        }

        // --- CALCULA DIMENSÕES ESPERADAS ---
        function getExpectedDimensions() {
            const qtd = parseInt(document.getElementById('qtd-questoes').value) || 20;
            const COLUNAS = 3;
            // Cálculo idêntico ao gerador
            const ROWS = Math.ceil(qtd / COLUNAS);
            const HEADER = 100;
            const FOOTER = 100;
            const LINE_H = 60;
            
            const realHeight = HEADER + (ROWS * LINE_H) + FOOTER;
            const realWidth = 1200;
            
            return { w: realWidth, h: realHeight, ratio: realWidth / realHeight, qtd: qtd };
        }

        function processVideoLoop() {
            if (!isStreaming) return;

            try {
                let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
                let cap = new cv.VideoCapture(video);
                cap.read(src);

                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                
                // Pré-processamento
                let blurred = new cv.Mat();
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                
                // Threshold Adaptativo (Melhor que Canny para folhas de papel)
                let thresh = new cv.Mat();
                cv.adaptiveThreshold(blurred, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
                
                // Encontrar contornos
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let foundContour = null;
                const dims = getExpectedDimensions();

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);

                    // Filtra ruídos pequenos
                    if (area > 20000) { 
                        let peri = cv.arcLength(cnt, true);
                        let approx = new cv.Mat();
                        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                        if (approx.rows === 4) {
                            // Verifica se é convexo (formato de folha)
                            if (cv.isContourConvex(approx)) {
                                if (area > maxArea) {
                                    maxArea = area;
                                    if (foundContour) foundContour.delete();
                                    foundContour = approx;
                                } else {
                                    approx.delete();
                                }
                            } else { approx.delete(); }
                        } else { approx.delete(); }
                    }
                }

                ctxOverlay.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);

                if (foundContour) {
                    drawContour(foundContour);
                    
                    if (bestContourPoints) bestContourPoints.delete();
                    bestContourPoints = foundContour.clone();
                    
                    const btn = document.getElementById('btn-action');
                    btn.classList.add('ready');
                    btn.style.backgroundColor = "#00e676";
                    
                    foundContour.delete();
                } else {
                    bestContourPoints = null;
                    document.getElementById('btn-action').classList.remove('ready');
                    document.getElementById('btn-action').style.backgroundColor = "white";
                }

                src.delete(); gray.delete(); blurred.delete(); thresh.delete();
                contours.delete(); hierarchy.delete();

                requestAnimationFrame(processVideoLoop);
            } catch (err) { requestAnimationFrame(processVideoLoop); }
        }

        function drawContour(approx) {
            let pts = [];
            for(let i = 0; i < 4; i++) pts.push({ x: approx.intAt(i, 0), y: approx.intAt(i, 1) });

            ctxOverlay.beginPath();
            ctxOverlay.lineWidth = 5;
            ctxOverlay.strokeStyle = "#00e676";
            ctxOverlay.moveTo(pts[0].x, pts[0].y);
            ctxOverlay.lineTo(pts[1].x, pts[1].y);
            ctxOverlay.lineTo(pts[2].x, pts[2].y);
            ctxOverlay.lineTo(pts[3].x, pts[3].y);
            ctxOverlay.closePath();
            ctxOverlay.stroke();
        }

        function captureAndProcess() {
            if (!bestContourPoints) {
                alert("Gabarito não detectado. Tente colocar sobre uma mesa escura.");
                return;
            }

            document.getElementById('status-pill').innerText = "Processando Imagem...";
            
            let hiddenCanvas = document.getElementById('hiddenCanvas');
            hiddenCanvas.width = video.videoWidth;
            hiddenCanvas.height = video.videoHeight;
            let ctx = hiddenCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            
            let src = cv.imread(hiddenCanvas);
            
            // Organizar cantos
            let pts = [];
            for(let i=0; i<4; i++) pts.push({x: bestContourPoints.intAt(i,0), y: bestContourPoints.intAt(i,1)});
            
            pts.sort((a,b) => a.y - b.y);
            let top = pts.slice(0,2).sort((a,b) => a.x - b.x);
            let bottom = pts.slice(2,4).sort((a,b) => a.x - b.x);
            
            // Ordem: TL, TR, BR, BL (Para warpPerspective funcionar corretamente com matrizes padrão)
            // CUIDADO: A ordem dos pontos no srcTri deve bater com finalDst
            let sortedSrc = [top[0], top[1], bottom[1], bottom[0]];

            let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                sortedSrc[0].x, sortedSrc[0].y,
                sortedSrc[1].x, sortedSrc[1].y,
                sortedSrc[2].x, sortedSrc[2].y, 
                sortedSrc[3].x, sortedSrc[3].y
            ]);

            // Definir tamanho de destino (unwarped)
            const dims = getExpectedDimensions();
            // Reduzimos a resolução final para acelerar (800px de largura é suficiente)
            const finalW = 800; 
            const finalH = Math.round(finalW / dims.ratio);

            let finalDst = cv.matFromArray(4, 1, cv.CV_32FC2, [
                0, 0,
                finalW, 0,
                finalW, finalH,
                0, finalH
            ]);

            let M = cv.getPerspectiveTransform(srcTri, finalDst);
            let warped = new cv.Mat();
            cv.warpPerspective(src, warped, M, new cv.Size(finalW, finalH));

            // MOSTRAR O RECORTE NO MODAL (DEBUG VISUAL)
            cv.imshow('debug-cut', warped);

            // Binarizar e Ler
            let warpedGray = new cv.Mat();
            cv.cvtColor(warped, warpedGray, cv.COLOR_RGBA2GRAY);
            let warpedThresh = new cv.Mat();
            cv.adaptiveThreshold(warpedGray, warpedThresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 21, 10);

            analyzeBubbles(warpedThresh, finalW, finalH, dims.qtd);

            src.delete(); srcTri.delete(); finalDst.delete(); M.delete(); warped.delete(); warpedGray.delete(); warpedThresh.delete();
        }

        function analyzeBubbles(binaryImage, w, h, qtd) {
            // Fatores de escala em relação ao original de 1200px
            const scaleX = w / 1200;
            const originalH = 100 + (Math.ceil(qtd/3)*60) + 100;
            const scaleY = h / originalH;

            let answers = [];
            const options = ['A', 'B', 'C', 'D', 'E'];
            const COLUNAS = 3;
            const Q_POR_COL = Math.ceil(qtd / COLUNAS);

            // Para desenhar onde ele leu (Debug)
            let debugCanvas = document.getElementById('debug-cut');
            let ctxDebug = debugCanvas.getContext('2d');
            ctxDebug.strokeStyle = 'red';
            ctxDebug.lineWidth = 2;

            for (let i = 1; i <= qtd; i++) {
                const colIndex = Math.floor((i - 1) / Q_POR_COL);
                const lineIndex = (i - 1) % Q_POR_COL;
                
                // Posições baseadas no GERADOR
                // Margin(80) + Colunas + OffsetBolinha(100)
                const baseX = 80 + (colIndex * (1040/3)) + 100; // 1040 = 1200 - 160
                const baseY = 100 + 10 + (lineIndex * 60);

                let bestOpt = '-';
                let maxPix = 0;

                options.forEach((opt, idx) => {
                    let cx = (baseX + (idx * 55)) * scaleX;
                    let cy = baseY * scaleY;
                    let r = 14 * scaleX; // Raio de leitura

                    // Visualizar onde está lendo
                    ctxDebug.beginPath();
                    ctxDebug.arc(cx, cy, r, 0, 2*Math.PI);
                    ctxDebug.stroke();

                    let x = Math.floor(cx - r);
                    let y = Math.floor(cy - r);
                    let side = Math.floor(r * 2);

                    if(x>0 && y>0 && x+side<w && y+side<h) {
                        let roi = binaryImage.roi(new cv.Rect(x, y, side, side));
                        let count = cv.countNonZero(roi);
                        roi.delete();

                        if(count > maxPix) {
                            maxPix = count;
                            if(count > 30) bestOpt = opt; // Sensibilidade
                        }
                    }
                });
                answers.push({ q: i, val: bestOpt });
            }
            
            showResults(answers);
        }

        function showResults(data) {
            const list = document.getElementById('answers-list');
            list.innerHTML = '';
            data.forEach(d => {
                list.innerHTML += `<div class="ans-item"><div class="ans-q">Q${d.q}</div><div class="ans-val">${d.val}</div></div>`;
            });
            document.getElementById('result-modal').style.display = 'flex';
            document.getElementById('status-pill').innerText = "Leitura Concluída";
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('status-pill').innerText = "Aponte para a folha...";
        }
    </script>
</body>
</html>
